name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: lint
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'
      - name: Mix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            deps
            _build/lint
          key: mix-lint-${{ runner.os }}-ex1.19-otp28-${{ hashFiles('**/mix.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: shellcheck -x scripts/*.sh test/scripts/*.sh
      - run: bash test/scripts/vendor_download_test.sh
      - run: mix compile --warnings-as-errors
      - run: mix dialyzer --format short
      - run: mix credo --all --strict --format=oneline

  test:
    name: test (${{ matrix.os }}, Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            elixir: '1.15.8'
            otp: '26.2'
          - os: ubuntu-24.04
            elixir: '1.19'
            otp: '28'
          - os: ubuntu-24.04-arm
            elixir: '1.19'
            otp: '28'
          - os: macos-14
            elixir: '1.19'
            otp: '28'
    env:
      MIX_ENV: test
      OPENJTALK_BUNDLE_ASSETS: "1"  # ensure dic/voice exist for tests
      OPENJTALK_FULL_STATIC: "0"    # avoid static link on CI
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl tar unzip automake
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache mix
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            deps
          key: mix-test-${{ runner.os }}-${{ runner.arch }}-ex${{ matrix.elixir }}-otp${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile
      - run: mix test

  cross-rpi4:
    name: cross rpi4 (aarch64)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      MIX_TARGET: rpi4
      OPENJTALK_BUNDLE_ASSETS: "0"
      OPENJTALK_FULL_STATIC: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain & build utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake curl tar unzip file \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'
      - name: Cache mix
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            deps
          key: mix-cross-${{ runner.os }}-aarch64-ex1.19-otp28-${{ hashFiles('**/mix.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Compile for aarch64 RPi 4
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          AR: aarch64-linux-gnu-ar
          RANLIB: aarch64-linux-gnu-ranlib
          STRIP: aarch64-linux-gnu-strip
        run: |
          mix compile
          # Show what the compiler thinks the host is (useful for logs)
          aarch64-linux-gnu-gcc -dumpmachine
      - name: Verify binary is aarch64
        run: |
          set -euo pipefail
          BIN="$(find _build -type f -name open_jtalk -path '*/priv/bin/*' | head -n1)"
          test -n "$BIN"
          file "$BIN"
          file "$BIN" | grep -F 'ARM aarch64' >/dev/null

  package:
    name: Hex package smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIX_ENV: docs
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl tar unzip automake
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Build and inspect package
        run: |
          mix hex.build --unpack --output /tmp/open_jtalk-package
          test -f /tmp/open_jtalk-package/Makefile
          test -f /tmp/open_jtalk-package/vendor/config/config.sub
          test ! -e /tmp/open_jtalk-package/vendor/open_jtalk-1.11.tar.gz
      - name: Compile unpacked package
        working-directory: /tmp/open_jtalk-package
        env:
          MIX_ENV: test
          OPENJTALK_BUNDLE_ASSETS: "0"
          OPENJTALK_FULL_STATIC: "0"
        run: |
          mix deps.get
          mix compile --warnings-as-errors
